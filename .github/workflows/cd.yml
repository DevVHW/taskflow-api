name: CD

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem versionada
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/devvhw/taskflow-api:${{ github.sha }}
            ghcr.io/devvhw/taskflow-api:latest

  deploy-staging:
    needs: publish-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy em homologacao (simulado)
        run: echo "Deploy da imagem em staging"
      - name: Smoke test simulado
        run: echo "Executando testes de fumaca em staging"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy em producao (simulado)
        run: echo "Deploy da imagem em producao"
      - name: Gerar tag de release
        run: echo "Baseline gerada"
