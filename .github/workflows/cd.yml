name: CD

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem versionada
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy-staging:
    needs: publish-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy em Homologação (simulado)
        run: echo "Deploy da imagem ghcr.io/${{ github.repository }}:${{ github.sha }} em staging"
      - name: Smoke test (simulado)
        run: echo "Executando testes de fumaça em staging..."

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy em Produção (simulado)
        run: echo "Deploy da imagem ghcr.io/${{ github.repository }}:${{ github.sha }} em produção"
      - name: Gerar tag de release (baseline)
        run: echo "Baseline gerada: ${{ github.sha }}"
